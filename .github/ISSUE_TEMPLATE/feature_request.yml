name: Feature request
description: Propose an improvement to the research-paper-review skill.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe public-safe requirements only. Do not include private papers, review artifacts, or venue-confidential material.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What workflow gap should this solve?
      placeholder: The current workflow makes it difficult to ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, docs, script, or validation change you want.
      placeholder: Add ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note simpler options, rejected approaches, or compatibility constraints.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Skill workflow
        - OCR or preprocessing
        - Timing and audit trail
        - HTML rendering
        - Explainer server
        - Validation or CI
        - Documentation
        - Packaging or installation
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included private paper text, confidential review content, or local-only artifact paths.
          required: true
